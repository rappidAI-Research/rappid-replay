name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Resolve modules
        run: go mod tidy
      - name: Print module lock
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo '---GO_MOD_BEGIN---'
          cat go.mod
          echo '---GO_MOD_END---'
          echo '---GO_SUM_BEGIN---'
          cat go.sum
          echo '---GO_SUM_END---'
      - name: Format check
        shell: bash
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Test
        run: go test ./...
